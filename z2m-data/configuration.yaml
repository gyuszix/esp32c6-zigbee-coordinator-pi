version: 5
mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883
serial:
  port: /dev/ttyAMA0
  adapter: zboss
  baudrate: 115200
  rtscts: false
advanced:
  log_level: info
  log_directories_to_keep: 50
  channel: 25
  transmit_power: 20
  network_key: "!secret.yaml network_key"
  pan_id: "!secret.yaml pan_id"
  ext_pan_id: "!secret.yaml ext_pan_id"
  enable_external_js: false
frontend:
  enabled: true
  port: 8080
homeassistant:
  enabled: true
onboarding: false
devices: devices.yaml
