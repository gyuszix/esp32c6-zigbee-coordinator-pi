listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# allow_anonymous defaults to false in Mosquitto 2.x. It is set true here for a
# single-host home setup where the broker is only reached by Zigbee2MQTT and,
# later, Home Assistant. If the broker becomes reachable beyond a trusted
# network, add a password_file and set this to false.
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html
