listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# allow_anonymous defaults to false in Mosquitto 2.x. It is set true here
# because the broker is only reachable over Tailscale: docker-compose.yml
# publishes port 1883 on the Pi's Tailscale IP, not on the LAN. Clients are
# Zigbee2MQTT (over the Compose network) and Home Assistant (over Tailscale).
# If the broker is ever published beyond the tailnet, or the tailnet is shared
# with other people, add a password_file and set this to false.
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html
