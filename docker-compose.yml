services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    # Bound to the Pi's own Tailscale IP, same as the Zigbee2MQTT frontend below.
    # The broker allows anonymous clients, so publishing it on all interfaces
    # would let any device on the LAN read and control every Zigbee device.
    # Zigbee2MQTT doesn't use this port (it connects over the Compose network);
    # Home Assistant connects to this Tailscale address.
    ports:
      - "100.x.x.x:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./log:/mosquitto/log

  zigbee2mqtt:
    image: ghcr.io/tostmann/zigbee2mqtt-esp32:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    # Bound to the Pi's own Tailscale IP so the unauthenticated admin UI is not
    # reachable from the LAN. Replace with your address, or use "8080:8080" to
    # expose it on all interfaces.
    ports:
      - "100.x.x.x:8080:8080"
    volumes:
      - ./z2m-data:/app/data
    # Passes the Pi's hardware UART into the container. Without this the
    # container cannot see the coordinator at all.
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
    environment:
      - TZ=America/New_York
